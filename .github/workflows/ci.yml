name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CarDiagnosticSystem.sln --configuration Release -warnaserror
      - run: dotnet test CarDiagnosticSystem.sln --configuration Release --no-build --logger "console;verbosity=normal"
      - run: dotnet run --project samples/Diagnostic.Sample --configuration Release --no-build
